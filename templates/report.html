<!doctype html>
<!--
  Reference-only template for the single-file HTML report design system.
  The runtime HTML generator lives in lib/report.mjs -> renderHtml() and
  renderSiteIndex() so the CLI stays a zero-dependency package with no
  template loader. Edit lib/report.mjs when changing report output.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>one-step-seo report — {{URL}}</title>
    <style>
      :root {
        --bg: #f8fafc;
        --fg: #0f172a;
        --muted: #475569;
        --card: #ffffff;
        --line: #e2e8f0;
        --code: #f1f5f9;
        --accent: #2563eb;
        --accent-alt: #7c3aed;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #090d16;
          --fg: #f8fafc;
          --muted: #94a3b8;
          --card: #111726;
          --line: #1e293b;
          --code: #172033;
          --accent: #3b82f6;
          --accent-alt: #8b5cf6;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
    </style>
  </head>
  <body>
    <main id="main">
      <h1>one-step-seo report — {{URL}}</h1>
      <p>
        Search SEO: {{SEARCH_SCORE}}/100 ({{SEARCH_BAND}}) | AI Visibility: {{AI_SCORE}}/100 ({{AI_BAND}})
      </p>
    </main>
  </body>
</html>
