<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Terminal demo of one-step-seo auditing a website">
  <rect x="0" y="0" width="760" height="320" rx="12" fill="#0d1117"/>
  <rect x="0" y="0" width="760" height="320" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="28" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="24" r="6" fill="#febc2e"/>
  <circle cx="68" cy="24" r="6" fill="#28c840"/>
  <text x="92" y="29" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8b949e">terminal — one-step-seo</text>
  <line x1="0" y1="44" x2="760" y2="44" stroke="#30363d" stroke-width="1"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5">
    <text x="24" y="76" fill="#3fb950">$</text>
    <text x="40" y="76" fill="#e6edf3">npx one-step-seo audit https://your-site.com --pages 5</text>
    <text x="24" y="106" fill="#8b949e">crawl  5 pages over same-host links … done in 3.2s</text>
    <text x="24" y="136" fill="#e6edf3">Search SEO:     <tspan font-weight="bold" fill="#3fb950">87/100 (B)</tspan></text>
    <text x="24" y="166" fill="#e6edf3">AI Visibility:  <tspan font-weight="bold" fill="#58a6ff">80/100 (B)</tspan></text>
    <text x="24" y="196" fill="#8b949e">Counts: P0=0  P1=2  P2=5  P3=0  pass=31</text>
    <text x="24" y="226" fill="#d29922">P1  Title too short ("Our Services" — 13ch)</text>
    <text x="24" y="256" fill="#d29922">P1  No answer-first block in first 150 words</text>
    <text x="24" y="286" fill="#3fb950">Wrote:  seo-report/report.json  report.md  report.html</text>
  </g>
</svg>
