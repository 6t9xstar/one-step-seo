name: CI
on:
  push:
    branches: [main, "verify/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee94edb60a # v4.0.3
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node bin/cli.mjs doctor
      - run: npm run examples:check
      - run: npm pack --dry-run

  coverage:
    # Coverage thresholds live in test:coverage:gate, which needs Node 22+ for
    # --test-coverage-{lines,branches,functions}, so this runs on 22 only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee94edb60a # v4.0.3
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage:gate
      - run: npm audit --audit-level=high

  bun:
    # Bun is a supported runtime: the full suite runs under `bun test`, and the
    # standalone executable for each OS is built and smoke-tested
    # (--version + an offline audit; see scripts/build-binaries.mjs).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee94edb60a # v4.0.3
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: npm ci
      - run: bun bin/cli.mjs doctor
      - run: npm run test:bun
      - run: npm run build:bin
