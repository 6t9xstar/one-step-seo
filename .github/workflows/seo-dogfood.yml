name: Weekly SEO dogfood
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node bin/cli.mjs audit https://example.com --pages 3 --out ./seo-report
      - uses: actions/upload-artifact@v4
        with:
          name: seo-report
          path: seo-report/
