name: Release binaries
# Attach standalone executables (built with Bun, no Node.js needed) to each
# GitHub Release. Each one is built on its own OS so the smoke test in
# scripts/build-binaries.mjs runs the real binary; macOS x64 is cross-compiled
# on the arm64 runner and is not smoke-tested.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach binaries to (e.g. v0.13.0)
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: --target bun-linux-x64
          - os: ubuntu-24.04-arm
            targets: --target bun-linux-arm64
          - os: macos-latest
            targets: --target bun-darwin-arm64 --target bun-darwin-x64
          - os: windows-latest
            targets: --target bun-windows-x64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee94edb60a # v4.0.3
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: node scripts/build-binaries.mjs ${{ matrix.targets }} --out dist-bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.os }}
          path: dist-bin/one-step-seo-*
          if-no-files-found: error

  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-bin
          merge-multiple: true
      - name: Checksums
        working-directory: dist-bin
        run: sha256sum one-step-seo-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist-bin/* --clobber --repo "$GITHUB_REPOSITORY"
